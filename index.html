<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #8e44ad);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      color: #6a11cb;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    textarea {
      resize: none;
    }

    .radio-group {
      margin-top: 5px;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4facfe, #8e44ad);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="form-container">
  <h2>Join Us</h2>

  <form action="https://formspree.io/f/xjgproay" method="POST">

    <label>Full Name</label>
    <input type="text" required>

    <label>Email</label>
    <input type="email" required>

    <label>Facebook Profile</label>
    <input type="text"  placeholder="important">

    <label>Grade</label>
    <input type="text" required>

    <label>Do you have skills?</label>
    <div class="radio-group">
      <input type="radio" name="skills" onclick="showSkills()"> Yes
      <input type="radio" name="skills" onclick="showLearning()"> No
    </div>

    <!-- SHOW IF YES -->
    <div id="skillsBox" class="hidden">
      <label>List your skills</label>
      <textarea rows="2"></textarea>
    </div>

    <!-- SHOW IF NO -->
    <div id="learningBox" class="hidden">
      <label>What do you want to learn?</label>
      <textarea rows="2"></textarea>
    </div>

    <label>Have you been part of a club before?</label>
    <div class="radio-group">
      <input type="radio" name="club" value="yes"> Yes
      <input type="radio" name="club" value="no"> No
    </div>

    <label>Work Preference</label>
    <select>
      <option>Work Alone</option>
      <option>Work in a Group</option>
    </select>

    <button type="submit">Submit</button>

  </form>
</div>

<script>
  function showSkills() {
    document.getElementById("skillsBox").classList.remove("hidden");
    document.getElementById("learningBox").classList.add("hidden");
  }

  function showLearning() {
    document.getElementById("learningBox").classList.remove("hidden");
    document.getElementById("skillsBox").classList.add("hidden");
  }
</script>

</body>
</html>
